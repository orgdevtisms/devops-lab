name: CI/CD - Web App

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:

  build:
    name: Build e Teste
    runs-on: self-hosted

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar Docker
        run: |
          docker --version
          docker compose version

      - name: Build
        run: |
          docker build -t web-app:test .

      - name: Testar aplicação
        run: |
          docker run -d \
            --name web-app-test \
            -p 18080:80 \
            web-app:test

          sleep 5

          curl --fail http://localhost:8080

      - name: Remover container de teste
        if: always()
        run: |
          docker rm -f web-app-test || true

      - name: Remover imagem de teste
        if: always()
        run: |
          docker image rm web-app:test || true

  deploy:
    name: Deploy Portainer
    needs: build
    runs-on: self-hosted

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      - name: Atualizar Stack no Portainer
        run: |
          curl -kfsS -X POST "${{ secrets.PORTAINER_WEBHOOK }}"
