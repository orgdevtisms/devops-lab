name: CI/CD - Web App

on:
  push:
    branches:
      - Develop

  pull_request:
    branches:
      - Develop

  workflow_dispatch:

jobs:

  build:
    name: Build e Teste
    runs-on: self-hosted

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar Docker
        run: |
          docker --version
          docker compose version

      - name: Build
        run: |
          docker build -t web-app:test .

      - name: Testar aplicação
        run: |
          docker run -d \
            --name web-app-test \
            -p 18080:80 \
            web-app:test

          sleep 5

          docker ps
          docker logs web-app-test

          curl --fail http://localhost:18080

      - name: Remover container de teste
        if: always()
        run: |
          docker rm -f web-app-test || true

      - name: Remover imagem de teste
        if: always()
        run: |
          docker image rm web-app:test || true

  deploy:
    name: Deploy Portainer
    needs: build
    runs-on: self-hosted

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      - name: Atualizar Stack no Portainer
        run: |
          curl -kfsS -X POST https://10.200.201.119:9443/api/stacks/webhooks/ff3d49e5-2b8b-4295-9749-6a6a2e5eeb5b
