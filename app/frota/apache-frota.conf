<VirtualHost *:80>
    ServerName frota.local
    DocumentRoot /var/www/frota/public
    <Directory /var/www/frota/public>
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/frota_error.log
    CustomLog ${APACHE_LOG_DIR}/frota_access.log combined
</VirtualHost>
